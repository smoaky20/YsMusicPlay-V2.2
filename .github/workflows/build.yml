
name: Build Ys Music Play V2.2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -o YsMusicPlay_V2_2_TEST.zip -d project
          cp project/settings.gradle.kts .
          cp project/build.gradle.kts .
          cp project/gradle.properties .
          cp -R project/app .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YsMusicPlay-V2.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
